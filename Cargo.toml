[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.2"
edition = "2024"
# GPL-3.0-or-later with the Misty Engine runtime exception (RUNTIME-EXCEPTION.md). Not an SPDX
# expression cargo accepts (the exception is custom), so the license file is named instead.
license-file = "LICENSE"

[workspace.dependencies]
# `accesskit`: screen readers (on by default in eframe; named so it stays on).
eframe = { version = "0.36", features = ["persistence", "accesskit"] }
egui = "0.36"
egui-wgpu = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
glam = { version = "0.34", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30"
hecs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rapier3d = "0.36"
rapier2d = "0.36"
kira = { version = "0.12.6", default-features = false, features = ["cpal", "mp3", "ogg", "vorbis", "wav", "pcm"] }
mlua = { version = "0.11", features = ["lua54", "vendored"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "exr", "gif"] }
gltf = { version = "1", default-features = false, features = ["import", "utils", "names", "extensions", "KHR_texture_transform", "KHR_materials_transmission"] }
tobj = "4"
gilrs = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

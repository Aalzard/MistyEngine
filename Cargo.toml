[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui-wgpu = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
glam = { version = "0.34", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30"
hecs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rapier3d = "0.36"
rapier2d = "0.36"
kira = { version = "0.12.6", default-features = false, features = ["cpal", "mp3", "ogg", "vorbis", "wav", "pcm"] }
mlua = { version = "0.11", features = ["lua54", "vendored"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gltf = { version = "1", default-features = false, features = ["import", "utils", "names"] }
tobj = "4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
eframe = "0.36"
egui = "0.36"
egui-wgpu = "0.36"
egui_dock = "0.21"
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

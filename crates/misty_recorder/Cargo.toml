[package]
name = "misty_recorder"
description = "Misty Engine Recorder package: frame capture on the GPU and the video, GIF and image sequence encoders"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
misty_engine = { path = "../misty_engine" }
serde.workspace = true
serde_json.workspace = true
# PNG and JPG sequences, GIF (NeuQuant palettes); the engine already builds these.
image.workspace = true
# MP4 (H.264): Cisco's OpenH264 encoder (BSD-2-Clause) compiled from its bundled C++ source by
# the openh264 crate (BSD-2-Clause), so nothing has to be installed. Our own MP4 writer boxes it.
openh264 = { version = "0.9", default-features = false, features = ["source"] }
# WebM (AV1): rav1e (BSD-2-Clause, pure Rust; its assembly needs nasm, so it is left out).
# Our own WebM writer boxes it.
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
# Sound in MP4 and WebM: Opus (royalty-free) through opus1 (BSD-3-Clause), a pure-Rust port of
# libopus, so nothing has to be installed or compiled from C.
opus1 = "0.3"

[dev-dependencies]
# The readback ring test on a real GPU.
pollster = "0.4"
glam.workspace = true

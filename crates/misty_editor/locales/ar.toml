# Misty Engine editor: العربية (Modern Standard Arabic).
#
# Each entry maps the English text, exactly as the code writes it, to its translation. Tables
# only group the entries by area; a missing or empty entry shows the English text. Keep every
# {placeholder} as it is (the tests check them). Write the text in logical order: the editor
# joins the letters and lays the text out right to left by itself. Terms: docs/localization.md.


[tutorials]
"Light shafts and god rays" = "حزم الضوء والأشعة الإلهية"
"Make sunlight cut through fog in visible rays: shadows, fog strength, contrast and a fog box." = "اجعل ضوء الشمس يخترق الضباب في أشعة مرئية: الظلال وكثافة الضباب والتباين وصندوق ضباب."
"Make it beautiful: Post-processing" = "اجعلها جميلة: المعالجة اللاحقة"
"Add a Post-process Volume, then tonemapping, glow, volumetric fog, sun shafts and moving clouds." = "أضف وحدة معالجة لاحقة، ثم تعيين النغمات والتوهج والضباب الحجمي وحزم الشمس والسحب المتحركة."
"Sculpt and paint a terrain" = "نحت التضاريس وتلوينها"
"Make hills and valleys with brushes, paint grass and rock, then let rules paint the whole terrain." = "اصنع التلال والوديان بالفُرش، ولوّن العشب والصخور، ثم دع القواعد تلوّن التضاريس كلها."
"Generate a world with World Builder" = "إنشاء عالم باستخدام منشئ العوالم"
"Build a whole landscape from settings: landform, erosion, mountains, an ocean, biomes, trees and rocks." = "ابنِ مشهدًا طبيعيًا كاملًا من الإعدادات: شكل الأرض والتعرية والجبال ومحيطًا والمناطق الحيوية والأشجار والصخور."


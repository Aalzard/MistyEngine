"Textures" = "الخامات"
"Albedo texture of this ground (drop a texture here)" = "خامة الألبيدو لهذه الأرض (أفلت خامة هنا)"
"Normal Map" = "خريطة العموديات"
"Bumps and detail lit by the sun; the number is its strength" = "النتوءات والتفاصيل التي تضيئها الشمس؛ الرقم هو قوتها"
"Normal map strength" = "قوة خريطة العموديات"
"Height Map" = "خريطة الارتفاع"
"Greyscale heights used to blend layers (none = the albedo's brightness)" = "ارتفاعات رمادية لمزج الطبقات (لا شيء = سطوع الألبيدو)"
"Tiling" = "التبليط"
"Tile Size" = "حجم البلاطة"
"World size of one texture repeat (metres along X and Z)" = "الحجم في العالم لتكرار واحد للخامة (بالمتر على X وZ)"
"Tile Offset" = "إزاحة البلاطة"
"Shifts the tiling (metres along X and Z)" = "إزاحة التبليط (بالمتر على X وZ)"
"Surface" = "السطح"
"Metallic" = "معدني"
"0 for ground and rock; 1 only for bare metal" = "0 للأرض والصخر؛ 1 للمعدن العاري فقط"
"Smoothness" = "النعومة"
"Rough (0) to glossy (1): wet rock, ice" = "من خشن (0) إلى لامع (1): صخر مبلل، جليد"
"Raise or Lower Terrain" = "رفع التضاريس أو خفضها"
"Set Height" = "تعيين الارتفاع"
"Smooth Height" = "تنعيم الارتفاع"
"Paint Texture" = "طلاء الخامة"
"Paint Holes" = "طلاء الثقوب"
"Paint Details" = "طلاء التفاصيل"
"Paint Trees" = "طلاء الأشجار"
"Place Objects" = "توزيع الكائنات"
"Terrain Settings" = "إعدادات التضاريس"
"Left click to raise the terrain. Hold Shift and click to lower it." = "انقر بالزر الأيسر لرفع التضاريس. اضغط Shift مع النقر لخفضها."
"Left click to move the terrain towards the target height." = "انقر بالزر الأيسر لتحريك التضاريس نحو الارتفاع المستهدف."
"Left click to average out nearby heights." = "انقر بالزر الأيسر لتسوية الارتفاعات القريبة."
"Select a layer, then left click to paint it. Auto Paint Rules and Generate paint the whole terrain." = "حدد طبقة ثم انقر بالزر الأيسر لطلائها. تطلي قواعد الطلاء التلقائي و«توليد» التضاريس كلها."
"Left click to cut holes (caves, tunnels) out of the terrain and its collider. Hold Shift and click to fill them in." = "انقر بالزر الأيسر لقطع ثقوب (كهوف، أنفاق) في التضاريس ومصادمها. اضغط Shift مع النقر لملئها."
"Pick grass or a detail mesh, then left click to paint it towards the target density. Hold Shift and click to erase." = "اختر عشبًا أو شبكة تفاصيل ثم انقر بالزر الأيسر لطلائها نحو الكثافة المستهدفة. اضغط Shift مع النقر للمسح."
"Pick a tree, then left click to plant trees. Hold Shift and click to remove them. Mass Place scatters trees over the whole terrain." = "اختر شجرة ثم انقر بالزر الأيسر لزراعة الأشجار. اضغط Shift مع النقر لإزالتها. ينثر «التوزيع الجماعي» الأشجار على التضاريس كلها."
"Pick a prefab (rocks, bushes, props), then left click to scatter it on the terrain. Hold Shift and click to erase." = "اختر قالبًا جاهزًا (صخور، شجيرات، دعامات) ثم انقر بالزر الأيسر لنثره على التضاريس. اضغط Shift مع النقر للمسح."
"Size, resolution and rendering of this terrain." = "حجم هذه التضاريس ودقتها وتصييرها."
"Hard" = "حادة"
"Firm" = "متماسكة"
"Soft" = "ناعمة"
"Feather" = "ريشية"
"Brush Shape" = "شكل الفرشاة"

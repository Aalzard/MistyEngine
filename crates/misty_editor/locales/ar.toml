[layout_tour]
"Editor Layout tour" = "جولة في واجهة المحرر"
"A two-minute look at the main areas of the editor: what each panel is for and where to find things." = "نظرة في دقيقتين على أجزاء المحرر الرئيسية: وظيفة كل لوحة وأين تجد ما تحتاجه."
"Scene Tree" = "شجرة المشهد"

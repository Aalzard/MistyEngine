"A walkable meadow with a first-person player: thin grass, trees, Misty GI. Free assets for your game." = "مرج يمكن التجول فيه مع لاعب بمنظور الشخص الأول: عشب رفيع وأشجار وإضاءة Misty GI. أصول مجانية للعبتك."

[templates]
"MeadowDemo" = "عرض المرج"
"First Person" = "منظور الشخص الأول"
"Racing" = "سباق"
"2D Platformer" = "منصات ثنائية الأبعاد"
"Floating Platform" = "المنصة العائمة"
"A walkable meadow with a first-person player: thin grass, trees, Misty GI. Free assets for your game." = "مرج يمكن التجول فيه مع لاعب بمنظور الشخص الأول: عشب رفيع وأشجار وإضاءة Misty GI. أصول مجانية للعبتك."
"A first-person player on an endless white plain, ready to press Play." = "لاعب بمنظور الشخص الأول على سهل أبيض لا نهاية له، جاهز للضغط على تشغيل."
"An arcade racer: a circuit, three cars, boost, a lap timer and live settings, all in Lua." = "لعبة سباق سريعة: حلبة وثلاث سيارات وتسارع ومؤقت للفات وإعدادات مباشرة، وكلها بلغة Lua."
"A 2D platformer: run and jump through a tilemap level, collect coins, 2D lights and glow. Paint more with the Tile Palette." = "لعبة منصات ثنائية الأبعاد: اركض واقفز عبر مرحلة من البلاطات، واجمع العملات، مع أضواء ثنائية الأبعاد وتوهج. ارسم المزيد بلوحة البلاطات."
"A platform floating in the sky: camera, sun, clouds and glow. Start from scratch." = "منصة تطفو في السماء: كاميرا وشمس وسحب وتوهج. ابدأ من الصفر."

[tutorials]
"Light shafts and god rays" = "حزم الضوء والأشعة الإلهية"
"Make sunlight cut through fog in visible rays: shadows, fog strength, contrast and a fog box." = "اجعل ضوء الشمس يخترق الضباب في أشعة مرئية: الظلال وكثافة الضباب والتباين وصندوق ضباب."
"Make it beautiful: Post-processing" = "اجعلها جميلة: المعالجة اللاحقة"
"Add a Post-process Volume, then tonemapping, glow, volumetric fog, sun shafts and moving clouds." = "أضف وحدة معالجة لاحقة، ثم تعيين النغمات والتوهج والضباب الحجمي وحزم الشمس والسحب المتحركة."
"Sculpt and paint a terrain" = "نحت التضاريس وتلوينها"
"Make hills and valleys with brushes, paint grass and rock, then let rules paint the whole terrain." = "اصنع التلال والوديان بالفُرش، ولوّن العشب والصخور، ثم دع القواعد تلوّن التضاريس كلها."
"Generate a world with World Builder" = "إنشاء عالم باستخدام منشئ العوالم"
"Build a whole landscape from settings: landform, erosion, mountains, an ocean, biomes, trees and rocks." = "ابنِ مشهدًا طبيعيًا كاملًا من الإعدادات: شكل الأرض والتعرية والجبال ومحيطًا والمناطق الحيوية والأشجار والصخور."


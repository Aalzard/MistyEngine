[package]
name = "misty_editor"
description = "Misty Engine editor"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "misty"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_dock.workspace = true
glam.workspace = true
bytemuck.workspace = true
misty_engine = { path = "../misty_engine" }
# Editor scripts (`editor_scripts`) run in their own Lua state.
mlua.workspace = true
png = "0.18"
serde_json.workspace = true
serde.workspace = true
rfd = "0.17"
trash = "5"
regex = "1"
# Build window: .zip archives of builds.
flate2 = "1"
crc32fast = "1"
# Updater: HTTPS (rustls + webpki roots, no gzip/json extras), SHA-256 checks, release .zip reading.
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }
# Updater: the Linux release package is a .tar.gz (gunzip with flate2 above).
tar = { version = "0.4.44", default-features = false }
# MCP server (`mcp`): the live-editor bridge's random token, headless screenshots.
getrandom = "0.3"
pollster = "0.4"

[build-dependencies]
# Windows exe icon + version info (compiles a resource script with the SDK's rc.exe).
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
egui_kittest = "0.36"

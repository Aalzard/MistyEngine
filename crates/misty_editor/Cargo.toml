[package]
name = "misty_editor"
description = "Misty Engine editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "misty"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_dock.workspace = true
glam.workspace = true
bytemuck.workspace = true
misty_engine = { path = "../misty_engine" }
png = "0.18"
serde_json.workspace = true
serde.workspace = true
rfd = "0.17"
trash = "5"
regex = "1"
# Build window: .zip archives of builds.
flate2 = "1"
crc32fast = "1"

[build-dependencies]
# Windows exe icon + version info (compiles a resource script with the SDK's rc.exe).
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
egui_kittest = "0.36"
# Headless GPU for the sample scene bakes, checks and render tests.
pollster = "0.4"

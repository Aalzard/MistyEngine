[package]
name = "misty_engine"
description = "Misty Engine runtime: math, rendering, scene"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
hecs.workspace = true
serde.workspace = true
serde_json.workspace = true
rapier3d.workspace = true
rapier2d.workspace = true
mlua.workspace = true
kira.workspace = true
image.workspace = true
gltf.workspace = true
# World Builder: OS-independent sin/cos/pow, so a seed builds the same world everywhere.
libm = "0.2.16"
tobj.workspace = true
gilrs.workspace = true
# UI text: font rasteriser + the editor UI library's bundled fonts (no font files in the repo).
ab_glyph = "0.2.32"
rayon = "1.11"
epaint_default_fonts = "0.36.2"
# Reflection probes: half-float cubemaps, zlib-compressed probe files.
half = { version = "2.7", features = ["bytemuck"] }
flate2 = "1.1"
# Built games: LZ4 compression of `.pak` entries (pure Rust, so every target cross-compiles).
lz4_flex = "0.11"
# Asset bundles: remote downloads over HTTPS (rustls, as the editor's updater) and SHA-256 checks.
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
sha2 = "0.10"
# Rich text: right-to-left reordering (UAX #9) and complex-script shaping (Arabic joining).
unicode-bidi = "0.3.18"
rustybuzz = "0.20.1"

[dev-dependencies]
# Headless GPU tests (pixel comparisons, the stress benchmark).
pollster = "0.4"
# Test Runner: checks the JUnit results are well-formed XML.
quick-xml = "0.41"

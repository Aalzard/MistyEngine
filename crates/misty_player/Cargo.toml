[package]
name = "misty_player"
description = "Misty Engine standalone game player"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "misty_player"
path = "src/main.rs"

[dependencies]
misty_engine = { path = "../misty_engine" }
winit = "0.30"
pollster = "0.4"
png = "0.18"
serde_json.workspace = true

[build-dependencies]
# Windows exe icon + version info (compiles a resource script with the SDK's rc.exe).
winresource = { version = "0.1.34", default-features = false }
